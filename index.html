<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Which Flies? — the seesaw weight game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Lilita+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#24163A;--sky:#7FD1FF;--grass:#5ED36A;--wood:#F2A93B;--pop:#FF4F7B;--sun:#FFD23F;--paper:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:Fredoka,system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.sticker{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink)}
.outline{color:#fff;text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 7px 0 var(--ink)}

#top{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:2}
#logo{font-family:'Lilita One';font-size:clamp(20px,3.2vw,32px);padding:2px 16px 6px;transform:rotate(-3deg);background:var(--sun);margin:0;font-weight:400}
#logo span{color:var(--pop)}
#stats{display:flex;gap:10px}
.stat{padding:5px 14px 7px;text-align:right;line-height:1.05}
.stat b{display:block;font-family:'Lilita One';font-size:clamp(17px,2.4vw,22px);font-weight:400}
.stat small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.65}

#ask{position:fixed;left:0;right:0;top:clamp(78px,12vh,120px);text-align:center;pointer-events:none;z-index:1}
#ask h2{margin:0;font-family:'Lilita One';font-weight:400;font-size:clamp(28px,5.6vw,58px);letter-spacing:.01em}
#ask p{margin:8px 0 0;font-weight:600;font-size:clamp(14px,1.8vw,18px)}

.pick{position:fixed;left:0;top:0;transform:translate(-50%,-100%);font:400 clamp(16px,2.2vw,22px) 'Lilita One';padding:7px 18px 9px;background:var(--pop);color:#fff;border:4px solid var(--ink);border-radius:999px;box-shadow:0 6px 0 var(--ink);cursor:pointer;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;z-index:3;transition:box-shadow .08s,translate .08s}
.pick:hover{translate:0 -3px;box-shadow:0 9px 0 var(--ink)}
.pick:active{translate:0 4px;box-shadow:0 2px 0 var(--ink)}
.pick:focus-visible,.btn:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

#odo{position:fixed;left:50%;top:clamp(76px,11vh,110px);transform:translateX(-50%);text-align:center;z-index:2;pointer-events:none}
#odoNum{font-family:'Rubik Mono One';font-size:clamp(20px,4.6vw,52px);padding:8px 22px 10px;white-space:nowrap;display:inline-block}
#odoNum sup{font-size:.5em}
#zone{display:inline-block;margin-top:12px;padding:5px 14px 6px;border-radius:999px;background:var(--ink);color:var(--sun);font-weight:600;font-size:clamp(12px,1.6vw,16px);letter-spacing:.06em;text-transform:uppercase}
#zone.flash{animation:flash .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes flash{0%{transform:scale(.4) rotate(-6deg)}100%{transform:none}}

#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 28px));padding:20px 24px 24px;z-index:4;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6)}100%{transform:translate(-50%,-50%)}}
#card .eyebrow{display:inline-block;font:400 15px 'Lilita One';letter-spacing:.06em;text-transform:uppercase;padding:3px 12px 4px;border-radius:999px;border:3px solid var(--ink);background:var(--grass)}
#card.wrong .eyebrow{background:var(--pop);color:#fff}
#card h3{font:400 clamp(24px,4vw,32px)/1.1 'Lilita One';margin:12px 0 6px}
#card p{margin:0 0 14px;font-size:17px;line-height:1.35}
#card sup,#stats sup{font-size:.6em}
.scale{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:3px dashed var(--ink);border-radius:12px;margin-bottom:16px;font-size:16px}
.scale b{font-family:'Lilita One';font-weight:400}
.scale .note{grid-column:1/-1;font-size:13px;opacity:.7;margin-top:4px}
#card .fine{margin:12px 0 0;font-size:12px;line-height:1.3;opacity:.6;text-align:center}
.btn{font:400 22px 'Lilita One';padding:9px 22px 11px;width:100%;background:var(--pop);color:#fff;border:4px solid var(--ink);border-radius:999px;box-shadow:0 6px 0 var(--ink);cursor:pointer}
.btn:active{translate:0 4px;box-shadow:0 2px 0 var(--ink)}
#skip{position:fixed;right:16px;bottom:16px;width:auto;font-size:16px;padding:6px 16px 8px;background:var(--paper);color:var(--ink);z-index:3}

#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .18s;z-index:5}
#credit{position:fixed;left:12px;bottom:8px;font-size:11px;opacity:.75;z-index:1}
#credit a{color:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<header id="top">
  <h1 id="logo" class="sticker">Which <span>Flies?</span></h1>
  <div id="stats">
    <div class="stat sticker"><b id="sStreak">0</b><small>Streak</small></div>
    <div class="stat sticker"><b id="sTotal">0 m</b><small>Total launched</small></div>
  </div>
</header>

<div id="ask">
  <h2 class="outline">Which one is lighter?</h2>
  <p>Pick right and the launch counts toward your total.</p>
</div>

<button class="pick" id="pick0"></button>
<button class="pick" id="pick1"></button>

<div id="odo" hidden>
  <div id="odoNum" class="sticker">0 m</div><br>
  <div id="zone">The Backyard</div>
</div>

<button id="skip" class="btn sticker" hidden>Skip to landing</button>

<div id="card" class="sticker" role="dialog" aria-live="polite" hidden>
  <span class="eyebrow" id="cEye"></span>
  <h3 id="cHead"></h3>
  <p id="cBody"></p>
  <div class="scale" id="cScale"></div>
  <button class="btn" id="next">Next pair</button>
  <p class="fine">Distances are wildly exaggerated for fun. A real seesaw can't throw anything past the Moon.</p>
</div>

<div id="fade"></div>
<div id="credit">Art: <a href="https://github.com/jdecked/twemoji" target="_blank" rel="noopener">Twemoji</a> (CC-BY 4.0) · <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a> · Wikipedia</div>

<script src="items.js"></script>

const ITEMS = [];
for (const it of [...EXTRA, ...BASE_ITEMS]) if (!ITEMS.some(o => o.n === it.n)) ITEMS.push(it);
const SPACE_SRC = new Set(Object.values(SPACE));
for (const it of ITEMS) it.cat ||= it.src.includes('PokeAPI') ? 'poke' : it.src.includes('twemoji') ? 'thing' : SPACE_SRC.has(it.src) ? 'real' : 'pop';
const BY_CAT = {}; for (const it of ITEMS) (BY_CAT[it.cat] ||= []).push(it);
const CAT_ODDS = [['thing', 0.28], ['pop', 0.28], ['poke', 0.17], ['real', 0.13], ['huge', 0.14]];   // so no one kind takes over
const randomItem = () => {
  let r = Math.random(), cat = 'thing';
  for (const [c, p] of CAT_ODDS) { if ((r -= p) < 0) { cat = c; break; } }
  const list = BY_CAT[cat]; return list[Math.random() * list.length | 0];
};

// screenshots and photos have solid corners; those get drawn in a framed card instead of as a cut-out
const probe = Object.assign(document.createElement('canvas'), {width: 8, height: 8}).getContext('2d', {willReadFrequently: true});
function hasBackground(im) {
  try {
    probe.clearRect(0, 0, 8, 8); probe.drawImage(im, 0, 0, 8, 8);
    const d = probe.getImageData(0, 0, 8, 8).data, a = i => d[i * 4 + 3];
    return [a(0), a(7), a(56), a(63)].filter(v => v > 240).length >= 3;
  } catch (e) { return false; }
}
const imgCache = {};
function img(src) {
  if (!imgCache[src]) {
    const im = new Image(); im.decoding = 'async'; im.referrerPolicy = 'no-referrer'; im.crossOrigin = 'anonymous';
    im.onload = () => { im.ok = true; im.opaque = hasBackground(im); };
    im.onerror = () => im.bad = true; im.src = src; imgCache[src] = im;
  }
  return imgCache[src];
}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;

const MARKS = [

  [8849, 'a Mount Everest, sideways', 'Mount Everests, sideways'], [40075e3, 'a lap around Earth', 'laps around Earth'],
  [3.844e8, 'a trip to the Moon', 'trips to the Moon'], [1.496e11, 'a trip to the Sun', 'trips to the Sun'],
  [6.29e11, 'a trip to Jupiter', 'trips to Jupiter'], [5.9e12, 'a trip to Pluto', 'trips to Pluto'],
  [9.461e15, 'one light-year', 'light-years'], [4.0e16, 'a trip to the nearest star', 'trips to the nearest star'],
  [1e21, 'the Milky Way, end to end', 'Milky Ways, end to end'], [2.4e22, 'a trip to Andromeda', 'trips to Andromeda'],

// ---------- canvas & layout ----------
const cv = $('c'), ctx = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, G, S, L, PX, PY;
const PXD = 1600;           // screen pixels per decade of distance
const STARS = Array.from({length: 160}, (_, i) => [rnd(i, 1), rnd(i, 2), 0.6 + rnd(i, 3) * 1.8]);
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);

  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G = H * 0.8; S = clamp(Math.min(W, H) * 0.18, 70, 135); L = Math.min(W * 0.82, 640);

}
addEventListener('resize', resize); resize();

// ---------- game state ----------
let st = 'choose', t0 = 0, pair, heavy, light, correct, ang = 0, fl = null, camX = 0, camY = 0;
let thud = null, trail = [], streak = 0, total = 0, lastPair = [], zoneShown = -1, cardShown = false;

function newPair() {
  let a, b, n = 0;
  const close = Math.random() < 0.5;   // half the rounds are a closer (harder) call
  const ok = () => a !== b && !img(a.src).bad && !img(b.src).bad && !lastPair.includes(a) && !lastPair.includes(b) &&
    Math.abs(Math.log10(a.kg / b.kg)) > 0.03 && (!close || Math.abs(Math.log10(a.kg / b.kg)) < 1.3);
  do { a = randomItem(); b = randomItem(); } while (!ok() && ++n < 500);
  lastPair = [...lastPair, a, b].slice(-60); pair = [a, b];   // no repeats for ~30 rounds
  pair.forEach((it, i) => { img(it.src); const btn = $('pick' + i); btn.textContent = it.n; btn.setAttribute('aria-label', `${it.n} is lighter`); });
}

function plankEnd(side, a) {
  const dx = (side ? 1 : -1) * (L / 2 - S * 0.42);
  return {x: PX + dx * Math.cos(a), y: PY + dx * Math.sin(a) - 9 - S / 2};
}

function choose(side) {
  if (st !== 'choose') return;
  heavy = pair[0].kg > pair[1].kg ? 0 : 1; light = 1 - heavy; correct = side === light;
  st = 'drop'; t0 = performance.now();
  setUI();
}

function launch(now) {
  const e = plankEnd(light, ang);
  const ratio = pair[heavy].kg / pair[light].kg;
  const D = 30 * ratio ** 1.1;                 // exaggerated on purpose
  const lg = Math.log10(D + 1);
  fl = {ex: e.x, h0: G - S / 2 - e.y, D, lg, ratio, cur: 0, rot: 0,
    T: Math.min(21000, 2600 + lg * 520) * (reduced ? 0.6 : 1), t0: now,
    space: lg > Z[7].at, arcH: H * 0.33 + Math.min(lg, 7.6) * H * 0.06, spin: 7 + lg * 0.5, x: e.x, h: 0};
  trail = []; zoneShown = -1; st = 'fly'; setUI();
}

function nextRound() {
  const f = $('fade'); f.style.opacity = 1;
  setTimeout(() => {
    st = 'choose'; fl = null; camX = camY = 0; ang = 0; trail = []; thud = null; cardShown = false;
    newPair(); setUI(); f.style.opacity = 0; $('pick0').focus({preventScroll: true});
  }, 190);
}

function showCard() {
  cardShown = true;
  const H_ = pair[heavy], Lt = pair[light];
  if (correct) { streak++; total += fl.D; } else streak = 0;
  $('card').className = 'sticker' + (correct ? '' : ' wrong');
  $('cEye').textContent = correct ? 'Correct!' : 'Not quite';
  $('cHead').innerHTML = correct ? `${Lt.n} flew ${fmtDist(fl.D)}` : `${H_.n} is the heavy one`;
  $('cBody').innerHTML = correct ? landmark(fl.D)
    : `${Lt.n} still flew ${fmtDist(fl.D)}, but picks only count when you choose the lighter one. Streak reset.`;
  const row = it => `<span>${it.n}</span><b>${it.est ? '≈ ' : ''}${fmtKg(it.kg)}</b>`;
  const notes = [H_, Lt].filter(it => it.note).map(it => `${it.n}: ${it.note}`);
  if ([H_, Lt].some(it => it.est)) notes.push('≈ fan estimate');
  $('cScale').innerHTML = row(H_) + row(Lt) +
    `<span>${H_.n} is</span><b>${fmtNum(fl.ratio)}× heavier</b>` +
    (notes.length ? `<span class="note">${notes.join(' · ')}</span>` : '');
  $('sStreak').textContent = streak;
  $('sTotal').innerHTML = total ? fmtDist(total) : '0 m';
  setUI();
  $('next').focus({preventScroll: true});
}

function setUI() {
  $('ask').hidden = st !== 'choose';
  $('pick0').hidden = $('pick1').hidden = st !== 'choose';
  $('odo').hidden = !(st === 'fly' || st === 'land');
  $('skip').hidden = st !== 'fly';
  $('card').hidden = !cardShown;
}

$('pick0').onclick = () => choose(0);
$('pick1').onclick = () => choose(1);
$('next').onclick = nextRound;
$('skip').onclick = () => { if (fl) fl.t0 = performance.now() - fl.T; };
addEventListener('keydown', e => {
  if (st === 'choose' && (e.key === 'ArrowLeft' || e.key === '1')) choose(0);
  if (st === 'choose' && (e.key === 'ArrowRight' || e.key === '2')) choose(1);
});

// ---------- update ----------
let prev = performance.now();
function update(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (st === 'drop' && now - t0 > 340) { st = 'slam'; t0 = now; thud = {t: now, side: heavy}; }
  if (st === 'slam') {
    const k = Math.min(1, (now - t0) / 280);
    ang = (heavy ? 1 : -1) * 0.3 * easeBack(k);
    if (k >= 1) launch(now);
  }
  if (st === 'fly' || st === 'land') {
    const p = Math.min(1, (now - fl.t0) / fl.T);
    const u = 1 - (1 - p) ** 3;
    fl.cur = fl.lg * u;
    const travel = fl.cur * PXD;
    const rise = sstep(6.9, 8.3, fl.cur) * H * 2.5;
    if (st === 'fly') {
      fl.h = fl.space
        ? fl.h0 * (1 - p) + fl.arcH * Math.sin(Math.min(1, p * 2) * Math.PI / 2) + rise
        : fl.h0 * (1 - p) + fl.arcH * 4 * p * (1 - p);
      fl.rot += fl.spin * dt * (1 - p * 0.7);
      const sx = lerp(fl.ex, W * 0.36, sstep(0, W * 0.5, travel));
      fl.x = fl.ex + travel; camX = fl.x - sx;
      camY = Math.max(0, fl.h - Math.max(H * 0.18, G - S / 2 - H * 0.6));   // keep the flyer below the odometer
      trail.push([fl.x, fl.h]); if (trail.length > 28) trail.shift();

    } else {
      const k = Math.min(1, (now - fl.landT) / 900);
      const target = Math.round(fl.rot0 / (2 * Math.PI)) * 2 * Math.PI;
      fl.rot = lerp(fl.rot0, target, 1 - (1 - k) ** 3);
      if (fl.space) { fl.x += 40 * dt; fl.bob = Math.sin(now / 500) * 10; }
      else fl.h = Math.abs(Math.sin(k * Math.PI * 2.5)) * (1 - k) * 60;

      if (now - fl.landT > 1150 && !cardShown) showCard();

    const zi = zoneIdx(fl.cur);

}

// ---------- draw ----------
const LX = () => fl ? fl.ex : PX + L / 2;
const logAt = wx => (wx - LX()) / PXD;

const soft = {};   // space photos with their edges faded out, so they don't show as rectangles

  ctx.globalAlpha = alpha; ctx.globalCompositeOperation = blend;

function drawItem(it, x, y, rot = 0) {
  const im = img(it.src);

  if (!im.ok) {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#24163A'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, S * 0.4, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#24163A'; ctx.font = `${S * 0.35}px 'Lilita One'`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', 0, 2);
  } else if (it.round) {
    const r = S * 0.47, iw = im.naturalWidth, ih = im.naturalHeight, c = Math.max(2 * r / iw, 2 * r / ih) * 1.04;
    ctx.fillStyle = '#24163A'; ctx.beginPath(); ctx.arc(0, 6, r, 0, 7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.clip(); ctx.fillStyle = '#000'; ctx.fill();
    ctx.drawImage(im, -iw * c / 2, -ih * c / 2, iw * c, ih * c); ctx.restore();
    ctx.strokeStyle = '#24163A'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  } else if (it.card || im.opaque) {
    const s = S * 0.92, iw = im.naturalWidth, ih = im.naturalHeight, c = Math.max(s / iw, s / ih);
    ctx.fillStyle = '#24163A'; rr(-s / 2, -s / 2 + 6, s, s, 18); ctx.fill();
    ctx.save(); rr(-s / 2, -s / 2, s, s, 18); ctx.clip();
    ctx.drawImage(im, -iw * c / 2, -ih * c / 2, iw * c, ih * c); ctx.restore();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; rr(-s / 2 + 5, -s / 2 + 5, s - 10, s - 10, 14); ctx.stroke();

function farHeight(type, fx) {
  if (type === 'hills') return 70 + 40 * Math.sin(fx * 0.004) + 22 * Math.sin(fx * 0.011 + 1);
  if (type === 'dunes') return 55 + 35 * Math.sin(fx * 0.003) + 10 * Math.sin(fx * 0.009);
  if (type === 'city') { const b = Math.floor(fx / 64); return 90 + rnd(b, 7) * 190; }
  if (type === 'peaks') { const b = Math.floor(fx / 240), f = fx / 240 - b; return 80 + 200 * (1 - Math.abs(2 * f - 1)) * (0.5 + rnd(b, 9) * 0.5); }
  return 0;

function draw(now) {
  const view = fl ? fl.cur : 0;
  const zi = zoneIdx(view), z = Z[zi], zn = Z[Math.min(zi + 1, Z.length - 1)];
  const blend = zi < Z.length - 1 ? sstep(zn.at - 0.35, zn.at, view) : 0;
  const space = sstep(7.8, 8.6, view);

  ctx.save();
  if (thud && !reduced) {
    const age = (now - thud.t) / 1000, amp = Math.max(0, 1 - age / 0.45) * clamp(4 + Math.log10(pair[heavy].kg / pair[light].kg) * 2.5, 4, 26);
    ctx.translate((Math.random() - 0.5) * amp, (Math.random() - 0.5) * amp);
  }

  // sky
  const sg = ctx.createLinearGradient(0, 0, 0, H);
  sg.addColorStop(0, mix(z.sky[0], zn.sky[0], blend)); sg.addColorStop(1, mix(z.sky[1], zn.sky[1], blend));
  ctx.fillStyle = sg; ctx.fillRect(-30, -30, W + 60, H + 60);

  // stars
  if (space > 0) {
    ctx.fillStyle = '#fff';
    for (const [sx, sy, r] of STARS) {
      ctx.globalAlpha = space * (0.5 + 0.5 * Math.sin(now / 400 + sx * 50));
      const x = ((sx * W * 3 - camX * 0.03) % W + W) % W;
      ctx.beginPath(); ctx.arc(x, sy * H, r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // sun + clouds of the ground world
  if (space < 1) {
    drawImg(TW('2600'), W - 120 - camX * 0.01, 150, Math.min(110, W * 0.16), 1 - space);
    for (let i = 0; i < 6; i++) {
      const x = ((i * 397 - camX * 0.2) % (W + 300) + W + 300) % (W + 300) - 150;
      drawImg(TW('2601'), x, H * (0.14 + (i % 3) * 0.08) + camY * 0.3, 80 + (i % 3) * 25, (1 - space) * 0.95);
    }
  }

  const gy = G + camY;
  if (gy < H + 400) {

    for (let x = -20; x < W + 20; x += 4) {

      if (zz.far === 'peaks' && h > 170) { ctx.fillStyle = '#fff'; ctx.fillRect(x, gy - h, 5, (h - 170) * 0.8 + 8); }
      if (zz.far === 'city' && (x / 4 | 0) % 4 === 1) { ctx.fillStyle = 'rgba(255,230,140,.55)'; for (let wy = gy - h + 14; wy < gy - 20; wy += 22) ctx.fillRect(x, wy, 6, 8); }
    }

    for (let x = -20; x < W + 20; x += 24) {

      ctx.fillStyle = mix(Z[i].gr, Z[j].gr, i < 6 ? sstep(Z[j].at - 0.12, Z[j].at, lg) : 0);
      ctx.fillRect(x, gy, 25, H - gy + 40);

  const SW = 150;
  for (let k = Math.floor((camX - 200) / SW); k < (camX + W + 200) / SW; k++) {
    const wx = k * SW + rnd(k, 1) * SW * 0.6, lg = logAt(wx), pz = Z[zoneIdx(lg)];
    if (rnd(k, 4) > 0.72) continue;
    if (lg < 0.25 && Math.abs(wx - PX) < L / 2 + 90) continue;    // keep the seesaw clear
    const code = pz.p[(rnd(k, 2) * pz.p.length) | 0], x = wx - camX, photo = code.startsWith('http');
    const src = photo ? code : TW(code);
    if (!pz.air) {
      if (gy > H + 200) continue;
      const big = pz.far === 'city' ? 1.6 : 1, size = (46 + rnd(k, 3) * 56) * big;
      drawImg(src, x, gy - size * 0.42, size);
    } else {
      // space photos are big and screen-blended so their black backgrounds melt into the sky
      const size = photo ? 90 + rnd(k, 3) * 170 : 40 + rnd(k, 3) * 80;
      drawImg(src, x, H * 0.1 + rnd(k, 5) * H * 0.75, size, 1, photo && pz.at < 26 ? 'screen' : 'source-over');
    }

    ctx.fillStyle = '#F2A93B'; rr(-L / 2, -9, L, 18, 9); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(36,22,58,.25)'; ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * L / 5 - 20, -2); ctx.lineTo(i * L / 5 + 20, -2); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle = '#FFD23F'; ctx.strokeStyle = '#24163A'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(sx, sy, 8, 0, 7); ctx.fill(); ctx.stroke();

    if (fl && side === light) continue;
    const e = plankEnd(side, ang);
    let y = e.y;
    if (st === 'choose') y -= S * 0.55 + 10 + Math.sin(now / 450 + side * 2) * 8;
    if (st === 'drop') { const k = Math.min(1, (now - t0) / 340); y -= (S * 0.55 + 10) * (1 - k * k); }
    drawItem(pair[side], e.x - camX, y + camY);
    if (st === 'choose') {

      const bx = e.x - camX + (thud.side ? 1 : -1) * S * 0.2, by = e.y + S * 0.5 + camY;
      ctx.globalAlpha = 1 - Math.max(0, age - 0.6) / 0.4;
      ctx.fillStyle = '#FFD23F'; ctx.strokeStyle = '#24163A'; ctx.lineWidth = 4; ctx.beginPath();
      for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, rr2 = i % 2 ? r * 0.62 : r; ctx.lineTo(bx + Math.cos(a) * rr2 * 1.35, by + Math.sin(a) * rr2 * 0.8); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      const ratio = pair[heavy].kg / pair[light].kg;
      ctx.fillStyle = '#FF4F7B'; ctx.font = `${r * 0.42}px 'Lilita One'`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ratio < 3 ? 'boing' : ratio < 300 ? 'THUD!' : ratio < 1e8 ? 'KA-BOOM!' : 'KRAKOOM!!', bx, by + 2);
      ctx.globalAlpha = 1;

    for (let i = 1; i < trail.length; i++) {
      ctx.lineWidth = (i / trail.length) * S * 0.28;
      ctx.beginPath(); ctx.moveTo(trail[i - 1][0] - camX, iy(trail[i - 1][1])); ctx.lineTo(trail[i][0] - camX, iy(trail[i][1])); ctx.stroke();
    }
    drawItem(pair[light], fl.x - camX, iy(fl.h) + (fl.bob || 0), fl.rot);
  }
  ctx.restore();
}

function frame(now) { update(now); draw(now); requestAnimationFrame(frame); }
newPair(); setUI(); requestAnimationFrame(frame);
</script>
